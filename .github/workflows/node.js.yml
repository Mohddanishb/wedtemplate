name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Specify your preferred Node version
        cache: 'npm'       # Automatically caches dependencies for faster runs

    - name: Install dependencies
      run: npm ci

    - name: Run Build (if applicable)
      run: npm run build --if-present

    - name: Run Tests
      run: npm test
